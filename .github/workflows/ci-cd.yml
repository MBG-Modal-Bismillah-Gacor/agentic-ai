name: Agentic Sales Hub CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_and_build:
    name: Automated CI (QA Suite, Integration & PWA Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || pip install fastapi uvicorn pydantic reportlab requests psutil pytest

      - name: Run Integration Tests
        run: |
          python scripts/test_integration.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Build PWA Frontend Bundle
        working-directory: frontend
        run: |
          npm run build

      - name: Verify PWA Manifest & Service Worker
        run: |
          test -f frontend/dist/manifest.json || test -f frontend/public/manifest.json
          test -f frontend/dist/sw.js || test -f frontend/public/sw.js
          echo "✅ PWA Manifest & Service Worker siap didistribusikan!"
